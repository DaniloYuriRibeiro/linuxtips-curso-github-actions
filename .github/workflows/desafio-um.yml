name: desafio-um
on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Imagem Docker a ser utilizada'
        required: true
        type: string

jobs:
  desafio-um:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar imagem Docker
        run: docker pull ${{ inputs.docker_image }}

      - name: mostrar imagens no runner|
        run: |
          $IMAGE_NAME=$(echo "${{ inputs.docker_image }}" | cut -d ':' -f1)
          docker images | grep $IMAGE_NAME

      - name: Analisar imagem com Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ inputs.docker_image }}
          only-severities: critical,high
        
         
